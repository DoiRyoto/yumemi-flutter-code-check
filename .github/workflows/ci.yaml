name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format / Analyze / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check for untranslated messages
        run: |
          if [ -s l10n_untranslated.json ] && [ "$(jq -c . l10n_untranslated.json)" != "{}" ]; then
            echo "::error::翻訳されていないメッセージがあります"
            jq . l10n_untranslated.json
            exit 1
          fi

      - name: Generate code (freezed / json_serializable / riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      # 生成物は gitignore 済みなので、git 管理下に限定すれば自然に対象外になる
      - name: Check formatting
        run: |
          files=$(git ls-files '*.dart')
          if [ -n "$files" ]; then
            dart format --set-exit-if-changed $files
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            os: ubuntu-latest
            args: ""
          - target: web
            os: ubuntu-latest
            args: --base-href /${{ github.event.repository.name }}/
          - target: ios
            os: macos-latest
            args: --no-codesign
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build
        run: flutter build ${{ matrix.target }} --release ${{ matrix.args }}

      - uses: actions/upload-pages-artifact@v5
        if: matrix.target == 'web' && github.ref == 'refs/heads/main'
        with:
          path: build/web

  # 仮のデプロイ環境として Web 版を GitHub Pages に公開する。
  # 事前に Settings > Pages で Source を "GitHub Actions" にしておく必要がある。
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
